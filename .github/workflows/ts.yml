name: ts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (stick-web, client-core, ui)
        run: pnpm --filter @bellgrave/stick-web --filter @bellgrave/client-core --filter @bellgrave/ui run typecheck
      - name: Tests (stick-web, client-core, ui)
        run: pnpm --filter @bellgrave/stick-web --filter @bellgrave/client-core --filter @bellgrave/ui run test

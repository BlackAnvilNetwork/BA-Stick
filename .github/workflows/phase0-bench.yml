name: phase0-bench

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phase 0 baseline (ledger p50/p99, snapshot, tick)
        run: pnpm --filter @bellgrave/server exec tsx scripts/phase0-bench.ts

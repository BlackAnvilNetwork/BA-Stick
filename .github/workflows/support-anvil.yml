name: support-anvil

on:
  push:
    branches: ["cursor/**", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  server-anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # Engine rust-toolchain.toml pins 1.83.0 + wasm32 (reproducible pkg vs pin on Linux).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          targets: wasm32-unknown-unknown
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Foundry libs (lib/ is gitignored)
        working-directory: contracts/lok-log
        # foundry 1.5.1 rejects --no-commit; omit the flag (M-G).
        run: forge install foundry-rs/forge-std@v1.17.0 OpenZeppelin/openzeppelin-contracts@v5.4.0 OpenZeppelin/openzeppelin-contracts-upgradeable@v5.4.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Engine cargo test
        working-directory: contracts/lok-log/engine
        run: cargo test
      - name: Verify engine wasm pin (rebuild + diff pkg on pinned toolchain)
        working-directory: contracts/lok-log/engine
        run: node scripts/check-wasm-pin.mjs
      - name: Server suite (self-starts throwaway anvil when foundry+libs present)
        run: pnpm --filter @bellgrave/server test
      - name: Forge
        working-directory: contracts/lok-log
        run: forge test

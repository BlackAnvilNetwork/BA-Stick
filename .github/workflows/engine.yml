name: engine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/engine/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: stick-engine (subtree) tests
        run: cargo test --manifest-path engine/stick-engine/Cargo.toml -p stick_engine
      - name: stick-engine wasm build
        run: cargo build --manifest-path engine/stick-engine/Cargo.toml -p stick_web --target wasm32-unknown-unknown --release
      - name: ba-stick-render tests
        run: cargo test --manifest-path engine/Cargo.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - name: ba-stick-render wasm + bindings
        run: ./engine/build-wasm.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: stick-web typecheck + build
        run: |
          pnpm --filter @bellgrave/stick-web typecheck
          pnpm --filter @bellgrave/stick-web build

[package]
name = "ba_stick_render"
description = "Black Anvil renderer on Stick Engine: server units in, pixels out."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stick_engine = { path = "../stick-engine/crates/stick_engine" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData"] }

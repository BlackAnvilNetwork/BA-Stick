[package]
name = "ba_sdf_gear"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Experimental SDF → mesh gear generator (Jensen's Huang 1/1 path). No Bevy."
publish = false

[[bin]]
name = "ba-sdf-gear"
path = "src/main.rs"

[dependencies]
# Match fast-surface-nets' glam pin.
glam = "0.29"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
fast-surface-nets = "0.2.1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"
